name: Bug report
description: A skill did something wrong, or didn't start when it should have.
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill and skill version
      description: The skill name, and `metadata.version` from its SKILL.md.
      placeholder: eeid-native-auth-migrate-v2 0.2.5
    validations:
      required: true
  - type: input
    id: assistant
    attributes:
      label: Assistant and how you installed
      placeholder: Claude Code 2.1, plugin from the marketplace
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Include your request and the relevant part of the assistant's answer. Remove secrets, tokens, tenant IDs, and personal data first.
    validations:
      required: true
