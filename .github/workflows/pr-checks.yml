name: PR checks

# Deterministic checks for every pull request: manifests, skill rules, routing,
# and unit tests. Model-based evals don't run here; skill owners run them
# locally (see tests/evals/README.md). Follows microsoft/skills' test-harness.yml.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests and skills
        id: validate
        run: npm run validate

      - name: Run unit tests and skill checks
        id: test
        if: always() && steps.validate.conclusion != 'skipped'
        run: npm test

      - name: Write job summary
        if: always()
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ passed";; failure) echo "❌ failed";; *) echo "⏭️ $1";; esac; }
          {
            echo "## PR checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| \`npm run validate\` | $(icon "$VALIDATE") |"
            echo "| \`npm test\` | $(icon "$TEST") |"
            echo
            echo "Model-based evals don't run in CI. Skill owners run them locally."
          } >> "$GITHUB_STEP_SUMMARY"
