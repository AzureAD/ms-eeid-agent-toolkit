<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1rem;
      }

      main {
        background: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 12%);
        color: #1a1a1a;
        max-width: 30rem;
        padding: 2rem;
        width: 100%;
      }

      .brand {
        margin-block-end: 1.5rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }

      @media (forced-colors: active) {
        main {
          border: 1px solid CanvasText;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <header class="brand">
        <!-- Replace with approved customer branding and localized copy. -->
        <h1 id="page-title">Welcome</h1>
      </header>

      <!-- Microsoft Entra injects the authentication controls here. -->
      <div id="api"></div>

      <footer>
        <!-- Add only approved privacy, terms, and support links. -->
      </footer>
    </main>
  </body>
</html>
