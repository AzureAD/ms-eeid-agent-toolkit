schema_version: "1.1"
name: hosted-behavior-dry-run
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-implement-hosted-auth"'
  - name: executable-hosted-plan
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response gives a dependency-ordered dry-run plan identifying
      concrete files/configuration, server sessions and credential storage,
      the exact requested callback/logout URLs, manual registration/user-flow
      steps, and validation/rollback. It must preserve the chosen journeys
      and distinguish planned work from unperformed tenant/live-sign-in checks.
      FAIL for restarting approach selection, invented completed checks,
      password/MFA additions, embedded/BYOUX implementation, or only a
      missing-reference message rather than the requested plan.
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-created-files
    type: file_exists
    path: "**"
    exists: false
  - name: source-unchanged
    type: regex
    target: { source: file, path: src/server.mjs }
    pattern: '^import \{ createServer \} from "node:http";\s+export const server = createServer\(\(request, response\) => \{\s+response\.writeHead\(200, \{ "Content-Type": "text/plain" \}\);\s+response\.end\("Customer portal"\);\s+\}\);\s*$'
  - name: manifest-unchanged
    type: regex
    target: { source: file, path: package.json }
    pattern: '^\{\s+"name": "eeid-server-eval",\s+"private": true,\s+"type": "module"\s+\}\s*$'
