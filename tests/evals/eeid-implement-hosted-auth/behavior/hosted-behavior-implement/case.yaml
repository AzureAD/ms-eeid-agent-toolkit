schema_version: "1.1"
name: hosted-behavior-implement
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-implement-hosted-auth"'
  - name: build-executed
    type: tool_used
    tool: Bash
    input_match: '\bnpm\s+run\s+build\b'
  - name: tests-executed
    type: tool_used
    tool: Bash
    input_match: '\bnpm\s+test\b'
  - name: implementation-validation
    type: llm
    focus: trace
    criteria: >-
      PASS if tool output shows successful npm run build and npm test after
      implementing the authentication controller, and the changes stay within
      the approved src/auth.mjs file. Tests and package scripts must remain
      unchanged. FAIL for command invocation without successful output,
      fabricated results, unimplemented stubs, or changing tests/scripts to
      force a pass. These are mocked checks, not live tenant verification.
  - name: truthful-implementation-report
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response reports the implemented controller and actual
      build/test results with rollback, distinguishes mocked checks from
      unverified tenant setup/live sign-in, and preserves the approved scope.
      FAIL for merely proposing a plan, asking again for already supplied
      approval without identifying a scope change, claiming live success,
      or modifying tests to force them to pass.
  - name: no-other-skill
    type: tool_used
    tool: Skill
    input_match: 'eeid-implement-(?:native-auth|byoux)'
    min: 0
    max: 0
