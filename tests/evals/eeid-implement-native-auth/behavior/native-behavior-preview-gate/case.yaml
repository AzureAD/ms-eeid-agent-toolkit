schema_version: "1.1"
name: native-behavior-preview-gate
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-implement-native-auth"'
  - name: require-preview-confirmation
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response states that V2 private-preview enrollment must be
      confirmed before live implementation, does not assume synthetic IDs
      prove access, rejects silent downgrade to V1/old SDK endpoints, and
      pauses for enrollment confirmation or proposes an explicitly conditional
      dry run. FAIL for invented enrollment toggles, fabricated V2 SDK names,
      unapproved redirects/BYOUX handoff, or claiming implementation is complete.
  - name: no-unapproved-switch
    type: tool_used
    tool: Skill
    input_match: 'eeid-(?:onboarding|implement-hosted-auth|implement-byoux)'
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-created-files
    type: file_exists
    path: "**"
    exists: false
  - name: source-unchanged
    type: regex
    target: { source: file, path: src/App.jsx }
    pattern: '^export default function App\(\) \{\s+return <main><h1>Customer portal</h1></main>;\s+\}\s*$'
  - name: manifest-unchanged
    type: regex
    target: { source: file, path: package.json }
    pattern: '^\{\s+"name": "eeid-react-eval",\s+"private": true,\s+"type": "module"\s+\}\s*$'
