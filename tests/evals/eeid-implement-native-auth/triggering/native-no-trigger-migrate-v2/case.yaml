schema_version: "1.1"
name: native-no-trigger-migrate-v2
graders:
  - name: implementation-skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-implement-native-auth"'
    min: 0
    max: 0
    arm: both
  - name: migration-focused-answer
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response gives a migration-focused next step such as
      inventorying installed SDK/version and existing flows, preparing a
      reviewed migration plan, or identifying a dedicated migration skill.
      FAIL if it starts new-app onboarding, proposes replacing the architecture,
      or invents successful code changes. A migration skill need not be installed.
