schema_version: "1.1"
name: onboard-behavior-launch-paths
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-onboarding"'
  - name: two-launch-paths
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response leads with one recommendation and a short reason,
      offers Web (Microsoft-hosted) and Native (Embedded native authentication)
      as the only implementation paths, and waits for a choice. Other/help
      is allowed as a pause, not a third implementation path. FAIL if it offers
      BYOUX, Custom HTML, hosted custom content, or Custom authentication pages;
      asks unrelated tenant/factor questions; or claims implementation.
  - name: no-unconfirmed-handoff
    type: tool_used
    tool: Skill
    input_match: 'eeid-implement-(?:hosted-auth|native-auth|byoux)'
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-created-files
    type: file_exists
    path: "**"
    exists: false
  - name: source-unchanged
    type: regex
    target: { source: file, path: src/server.mjs }
    pattern: '^import \{ createServer \} from "node:http";\s+export const server = createServer\(\(request, response\) => \{\s+response\.writeHead\(200, \{ "Content-Type": "text/plain" \}\);\s+response\.end\("Customer portal"\);\s+\}\);\s*$'
  - name: manifest-unchanged
    type: regex
    target: { source: file, path: package.json }
    pattern: '^\{\s+"name": "eeid-server-eval",\s+"private": true,\s+"type": "module"\s+\}\s*$'
