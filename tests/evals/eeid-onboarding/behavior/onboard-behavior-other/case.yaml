schema_version: "1.1"
name: onboard-behavior-other
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-onboarding"'
  - name: explain-and-pause
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response distinguishes Microsoft-hosted branding/content
      from customer-hosted Bring your own UX, associates Custom authentication
      pages with the latter's portal/API name, states that BYOUX and Custom HTML
      are unavailable in this launch, and remains at Web/Native approach selection.
      FAIL if it offers either excluded path, conflates the features, selects an approach without confirmation,
      or advances to tenant, journeys, or factor setup. A direct question or
      an explicit statement that selection is pending is acceptable.
  - name: no-premature-handoff
    type: tool_used
    tool: Skill
    input_match: 'eeid-implement-(?:hosted-auth|native-auth|byoux)'
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-created-files
    type: file_exists
    path: "**"
    exists: false
  - name: source-unchanged
    type: regex
    target: { source: file, path: src/server.mjs }
    pattern: '^import \{ createServer \} from "node:http";\s+export const server = createServer\(\(request, response\) => \{\s+response\.writeHead\(200, \{ "Content-Type": "text/plain" \}\);\s+response\.end\("Customer portal"\);\s+\}\);\s*$'
  - name: manifest-unchanged
    type: regex
    target: { source: file, path: package.json }
    pattern: '^\{\s+"name": "eeid-server-eval",\s+"private": true,\s+"type": "module"\s+\}\s*$'
