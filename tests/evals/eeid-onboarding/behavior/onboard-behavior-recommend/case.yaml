schema_version: "1.1"
name: onboard-behavior-recommend
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-onboarding"'
  - name: recommend-and-wait
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response recommends Microsoft-hosted because redirects and
      lower UX maintenance fit, limits available paths to Web/Microsoft-hosted
      and Native, and asks for confirmation or clearly waits for
      the customer's choice. FAIL if it treats the server as proof BYOUX is
      required, offers BYOUX or Custom HTML, gathers unrelated tenant/factor details, claims implementation,
      or substitutes a generic answer about a missing implementation skill.
  - name: no-unconfirmed-handoff
    type: tool_used
    tool: Skill
    input_match: 'eeid-implement-(?:hosted-auth|native-auth|byoux)'
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-created-files
    type: file_exists
    path: "**"
    exists: false
  - name: source-unchanged
    type: regex
    target: { source: file, path: src/server.mjs }
    pattern: '^import \{ createServer \} from "node:http";\s+export const server = createServer\(\(request, response\) => \{\s+response\.writeHead\(200, \{ "Content-Type": "text/plain" \}\);\s+response\.end\("Customer portal"\);\s+\}\);\s*$'
  - name: manifest-unchanged
    type: regex
    target: { source: file, path: package.json }
    pattern: '^\{\s+"name": "eeid-server-eval",\s+"private": true,\s+"type": "module"\s+\}\s*$'
