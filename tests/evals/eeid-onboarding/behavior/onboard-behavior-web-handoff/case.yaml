schema_version: "1.1"
name: onboard-behavior-web-handoff
context:
  scaffold_script: scaffold.sh
graders:
  - name: onboarding-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-onboarding"'
  - name: selected-skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?eeid-implement-hosted-auth"'
  - name: no-unselected-skill
    type: tool_used
    tool: Skill
    input_match: 'eeid-implement-(?:native-auth|byoux)'
    min: 0
    max: 0
  - name: preserved-hosted-plan
    type: llm
    focus: last_message
    criteria: >-
      PASS if the response produces a concrete Web dry-run plan with server
      sessions, protected routes, supplied callback/logout URLs, manual tenant
      steps and tests, preserving email OTP/no MFA/no reset/no API/skip branding.
      FAIL for restarting selection, missing-sibling excuses, silently changing
      journeys, or claiming tenant/live sign-in success.
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-created-files
    type: file_exists
    path: "**"
    exists: false
  - name: source-unchanged
    type: regex
    target: { source: file, path: src/server.mjs }
    pattern: '^import \{ createServer \} from "node:http";\s+export const server = createServer\(\(request, response\) => \{\s+response\.writeHead\(200, \{ "Content-Type": "text/plain" \}\);\s+response\.end\("Customer portal"\);\s+\}\);\s*$'
  - name: manifest-unchanged
    type: regex
    target: { source: file, path: package.json }
    pattern: '^\{\s+"name": "eeid-server-eval",\s+"private": true,\s+"type": "module"\s+\}\s*$'
